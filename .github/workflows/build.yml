name: Build Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Enable Web
        run: flutter config --enable-web

      - name: Generate web platform
        run: flutter create --org com.example --project-name haoshi_web --platforms=web .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href="/guushi-web/"

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: haoshi-web
          path: build/web
          retention-days: 7
